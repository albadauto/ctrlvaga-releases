<body>
    <div id="app">
        <!-- Tela de carregamento enquanto o Blazor baixa: mesma cara do site -->
        <div class="boot">
            <img src="img/icon.png" alt="" width="72" height="72" />
            <div class="boot-bar"><span></span></div>
        </div>
    </div>

    <div id="blazor-error-ui" class="fixed inset-x-0 bottom-0 z-50 hidden bg-amber-400 px-4 py-3 text-center text-sm text-navy">
        Algo deu errado · Algo salió mal · Something went wrong. <a href="" class="reload font-semibold underline">↻</a>
        <a class="dismiss ml-3 cursor-pointer">✕</a>
    </div>

    <script>
        // Idioma do site (usado pelo SiteLanguage): ?lang= na URL, escolha salva ou idioma do navegador.
        // Sistema do visitante: no Windows o download vai para a Microsoft Store.
        window.ctrlvagaPlatform = {
            isWindows: function () {
                var p = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || navigator.userAgent || "";
                return /win/i.test(p);
            }
        };

        window.ctrlvagaLang = {
            get: function () {
                var fromUrl = new URLSearchParams(location.search).get("lang");
                if (fromUrl) return fromUrl;
                try {
                    var saved = localStorage.getItem("ctrlvaga-lang");
                    if (saved) return saved;
                } catch (e) { }
                return navigator.language || "pt";
            },
            apply: function (code, htmlLang, title) {
                document.documentElement.lang = htmlLang;
                if (title) document.title = title;
            },
            set: function (code, htmlLang, title) {
                try { localStorage.setItem("ctrlvaga-lang", code); } catch (e) { }
                window.ctrlvagaLang.apply(code, htmlLang, title);
                var url = new URL(location.href);
                if (url.searchParams.has("lang")) {
                    url.searchParams.set("lang", code);
                    history.replaceState(null, "", url);
                }
            }
        };
    </script>
    <script src="js/download-tracking.js?v=2"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
